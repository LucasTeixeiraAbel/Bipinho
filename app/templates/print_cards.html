<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Bipinho — Folha de Impressão de Códigos de Barras</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    body {
      background-color: #e2e8f0;
      color: #0f172a;
      padding-bottom: 40px;
    }

    /* Floating Toolbar (hidden in print) */
    .print-toolbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: #1e293b;
      color: white;
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .toolbar-title {
      font-size: 16px;
      font-weight: 700;
    }

    .toolbar-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
    }

    .btn-print {
      background: #10b981;
      color: white;
    }
    .btn-print:hover { background: #059669; }

    .btn-back {
      background: #475569;
      color: white;
    }
    .btn-back:hover { background: #334155; }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      cursor: pointer;
    }

    /* A4 Page Container */
    .sheet-wrapper {
      max-width: 210mm;
      margin: 20px auto;
    }

    .a4-page {
      background: white;
      width: 210mm;
      min-height: 297mm;
      padding: 12mm 12mm;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      border-radius: 4px;
      position: relative;
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #0f172a;
      padding-bottom: 8px;
      margin-bottom: 12px;
    }

    .header-logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-logo h1 {
      font-size: 20px;
      font-weight: 900;
      color: #1e3a8a;
    }

    .header-desc {
      font-size: 12px;
      color: #64748b;
    }

    /* Cards Grid */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10mm;
    }

    /* Individual Card for cutting */
    .drawing-card {
      border: 1.5px dashed #94a3b8;
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      background: #ffffff;
      break-inside: avoid;
      page-break-inside: avoid;
    }

    .cut-guide-corner {
      position: absolute;
      top: -8px;
      left: 10px;
      background: white;
      padding: 0 4px;
      font-size: 10px;
      color: #94a3b8;
    }

    .card-badge {
      align-self: flex-start;
      font-size: 10px;
      font-weight: 800;
      color: #2563eb;
      background: #eff6ff;
      padding: 2px 8px;
      border-radius: 4px;
      margin-bottom: 6px;
    }

    .card-thumb-box {
      width: 100%;
      height: 110px;
      background: #f1f5f9;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
      border: 1px solid #e2e8f0;
    }

    .card-thumb-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-title {
      font-size: 15px;
      font-weight: 800;
      color: #0f172a;
      text-align: center;
      line-height: 1.2;
      max-width: 90%;
    }

    .card-author {
      font-size: 11px;
      color: #64748b;
      margin-top: 2px;
    }

    .barcode-area {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 6px;
    }

    .barcode-svg-box {
      width: 90%;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .barcode-svg-box svg {
      width: 100%;
      height: 100%;
    }

    .barcode-text {
      font-family: monospace;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #0f172a;
      margin-top: 2px;
    }

    /* Special Cards (Parent Unlock & Surprise) */
    .special-card-parent {
      border: 2px solid #ef4444;
      background: #fff5f5;
    }
    .special-card-parent .card-badge {
      color: #b91c1c;
      background: #fee2e2;
    }

    .special-card-surprise {
      border: 2px solid #8b5cf6;
      background: #faf5ff;
    }
    .special-card-surprise .card-badge {
      color: #6d28d9;
      background: #ede9fe;
    }

    /* Print media rules */
    @media print {
      body {
        background: white;
        padding: 0;
      }
      .no-print {
        display: none !important;
      }
      .sheet-wrapper {
        margin: 0;
        max-width: none;
      }
      .a4-page {
        box-shadow: none;
        margin: 0;
        padding: 10mm 10mm;
        page-break-after: always;
      }
      @page {
        size: A4 portrait;
        margin: 0;
      }
    }
  </style>
</head>
<body>
  <!-- Print Control Bar -->
  <header class="print-toolbar no-print">
    <div class="toolbar-left">
      <span class="toolbar-title">Bipinho — Folha de Códigos A4</span>
      <span id="items-info" style="font-size: 13px; color: #94a3b8;">Carregando desenhos...</span>
    </div>
    <div class="toolbar-controls">
      <label class="checkbox-label">
        <input type="checkbox" id="chk-special" checked>
        Incluir Cartões Especiais (Pais & Surpresa)
      </label>
      <button class="btn btn-print" onclick="window.print()">🖨️ Imprimir Folha (Ctrl + P)</button>
      <a href="/admin" class="btn btn-back">← Voltar ao Painel</a>
    </div>
  </header>

  <!-- Sheet Container -->
  <main class="sheet-wrapper" id="sheet-container">
    <div class="a4-page">
      <p style="text-align: center; padding: 40px; color: #64748b;">Carregando cartões...</p>
    </div>
  </main>

  <script>
    (function() {
      let allItems = [];
      let settings = {};

      function loadData() {
        Promise.all([
          fetch('/api/admin/items').then(r => r.json()),
          fetch('/api/admin/settings').then(r => r.json())
        ]).then(([items, cfg]) => {
          allItems = items;
          settings = cfg;
          document.getElementById('items-info').textContent = `${items.length} desenho(s) cadastrado(s)`;
          renderPages();
        }).catch(err => {
          document.getElementById('sheet-container').innerHTML = 
            `<div class="a4-page"><p style="color:red">Erro carregando dados: ${err}</p></div>`;
        });
      }

      function renderPages() {
        const container = document.getElementById('sheet-container');
        const includeSpecial = document.getElementById('chk-special').checked;

        // Build list of cards to render
        let cards = [...allItems];

        if (includeSpecial) {
          const parentCode = settings.parent_unlock_code || 'PAIS-LIBERAR-99';
          const surpriseCode = settings.surprise_code || 'BIP-SURPRESA';

          cards.push({
            isSpecial: true,
            type: 'parent',
            code: parentCode,
            title: 'Chave dos Pais (Liberar Pausa)',
            author: 'Uso exclusivo dos pais',
            badge: 'Bipinho • Chave Secreta 🔑',
            icon: '🔑'
          });

          if (settings.surprise_enabled !== '0') {
            cards.push({
              isSpecial: true,
              type: 'surprise',
              code: surpriseCode,
              title: 'Desenho Surpresa!',
              author: 'Sorteia um desenho aleatório',
              badge: 'Bipinho • Surpresa 🎲',
              icon: '🎲'
            });
          }
        }

        if (cards.length === 0) {
          container.innerHTML = `
            <div class="a4-page">
              <div class="page-header">
                <div class="header-logo">
                  <h1>Bipinho</h1>
                  <span class="header-desc">Cartões de Desenhos Infantis</span>
                </div>
              </div>
              <p style="text-align: center; padding: 60px 20px; color: #64748b;">
                Nenhum desenho cadastrado para impressão.<br>
                Cadastre desenhos no painel administrativo antes de imprimir.
              </p>
            </div>
          `;
          return;
        }

        // 6 cards per A4 page (2 columns x 3 rows)
        const CARDS_PER_PAGE = 6;
        const totalPages = Math.ceil(cards.length / CARDS_PER_PAGE);

        let html = '';
        for (let p = 0; p < totalPages; p++) {
          const pageCards = cards.slice(p * CARDS_PER_PAGE, (p + 1) * CARDS_PER_PAGE);

          html += `
            <div class="a4-page">
              <div class="page-header">
                <div class="header-logo">
                  <h1>Bipinho</h1>
                  <span class="header-desc">Cartões para Pastinha da Criança • Página ${p + 1} de ${totalPages}</span>
                </div>
                <div style="font-size: 11px; color: #94a3b8;">
                  Recorte nas linhas tracejadas ✂
                </div>
              </div>

              <div class="cards-grid">
                ${pageCards.map(c => renderCardHtml(c)).join('')}
              </div>
            </div>
          `;
        }

        container.innerHTML = html;

        // Load barcode SVGs for all cards
        document.querySelectorAll('.barcode-svg-box').forEach(box => {
          const code = box.getAttribute('data-code');
          if (code) {
            fetch(`/api/barcode/${encodeURIComponent(code)}.svg?write_text=false`)
              .then(r => r.text())
              .then(svg => {
                box.innerHTML = svg;
              });
          }
        });
      }

      function renderCardHtml(item) {
        if (item.isSpecial) {
          const specialClass = item.type === 'parent' ? 'special-card-parent' : 'special-card-surprise';
          return `
            <div class="drawing-card ${specialClass}">
              <div class="cut-guide-corner">✂ cortar</div>
              <span class="card-badge">${item.badge}</span>
              <div class="card-thumb-box" style="font-size: 48px; background: white;">
                ${item.icon}
              </div>
              <div class="card-title">${item.title}</div>
              <div class="card-author">${item.author}</div>
              <div class="barcode-area">
                <div class="barcode-svg-box" data-code="${item.code}"></div>
                <span class="barcode-text">${item.code}</span>
              </div>
            </div>
          `;
        }

        const thumbUrl = `/media/thumbs/${item.thumb_filename}`;
        return `
          <div class="drawing-card">
            <div class="cut-guide-corner">✂ cortar</div>
            <span class="card-badge">Bipinho 📺</span>
            <div class="card-thumb-box">
              <img src="${thumbUrl}" alt="${item.title}" onerror="this.src='/static/icons/default_thumb.svg'">
            </div>
            <div class="card-title">${item.title}</div>
            <div class="card-author">${item.author}</div>
            <div class="barcode-area">
              <div class="barcode-svg-box" data-code="${item.code}"></div>
              <span class="barcode-text">${item.code}</span>
            </div>
          </div>
        `;
      }

      document.getElementById('chk-special').addEventListener('change', renderPages);

      document.addEventListener('DOMContentLoaded', loadData);
    })();
  </script>
</body>
</html>
