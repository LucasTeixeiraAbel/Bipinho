<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bipinho — Troca de Senha Obrigatória</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body {
      background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 50%, #06b6d4 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
      width: 100%;
      max-width: 440px;
      padding: 40px 32px;
      text-align: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 70px;
      height: 70px;
      background: #ef4444;
      color: white;
      border-radius: 20px;
      box-shadow: 0 10px 20px rgba(239, 68, 68, 0.4);
      margin-bottom: 16px;
      font-size: 32px;
    }
    h1 {
      color: #1e293b;
      font-size: 24px;
      font-weight: 800;
    }
    p.subtitle {
      color: #64748b;
      font-size: 14px;
      margin-top: 8px;
      line-height: 1.5;
    }
    form {
      margin-top: 24px;
      text-align: left;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      color: #334155;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="password"]:focus {
      border-color: #3b82f6;
    }
    .btn-submit {
      width: 100%;
      padding: 14px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 16px rgba(37, 99, 235, 0.3);
      transition: background 0.2s, transform 0.1s;
      margin-top: 8px;
    }
    .btn-submit:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }
    .alert-error {
      background: #fee2e2;
      color: #b91c1c;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 13px;
      margin-bottom: 18px;
      font-weight: 500;
      text-align: left;
      border-left: 4px solid #ef4444;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">🔒</div>
    <h1>Primeiro Acesso ao Bipinho</h1>
    <p class="subtitle">
      Por segurança, é obrigatório definir uma nova senha pessoal antes de continuar. A senha padrão inicial não pode mais ser utilizada.
    </p>

    <!-- ERROR_MESSAGE -->

    <form method="POST" action="/admin/trocar-senha-obrigatoria">
      <div class="form-group">
        <label for="new_password">Nova Senha Pessoal</label>
        <input type="password" id="new_password" name="new_password" minlength="4" placeholder="Mínimo 4 caracteres" required autofocus>
      </div>

      <div class="form-group">
        <label for="confirm_password">Confirmar Nova Senha</label>
        <input type="password" id="confirm_password" name="confirm_password" minlength="4" placeholder="Repita a nova senha" required>
      </div>

      <button type="submit" class="btn-submit">Salvar Senha e Entrar</button>
    </form>
  </div>
</body>
</html>
